# ระบบทั้งหมดรันใน Docker network เดียวกัน (lottery-net) — docker compose up -d --build
#
#   db       PostgreSQL · ข้อมูลอยู่ใน volume lottery-db-data (down ไม่ลบ · down -v ลบทั้งหมด)
#   migrate  เตรียมตาราง/ย้ายข้อมูลแล้วจบ (เว็บและบอทรอให้เสร็จก่อน)
#   app      เว็บ http://localhost:${APP_PORT:-3010}
#   worker   บอท WhatsApp — สแกน QR และเลือกกลุ่มที่หน้าเว็บ /whatsapp · session อยู่ใน volume wa-auth
#
# ในเครือข่ายภายใน ทุก service เรียกฐานข้อมูลด้วยชื่อ "db" · ค่าลับ (AUTH_SECRET) อ่านจาก .env
# พอร์ต 5434 ของฐานข้อมูลเปิดไว้ให้ bun run dev / prisma studio บนเครื่องนี้ (ผูกกับ 127.0.0.1 เท่านั้น)
name: nexttemplate

x-app: &app
  image: lottery-app:latest
  build:
    context: .
    args:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Lottery}
      NEXT_PUBLIC_APP_URL: ${DOCKER_APP_URL:-http://localhost:3010}
      NEXT_PUBLIC_TIME_ZONE: ${NEXT_PUBLIC_TIME_ZONE:-Asia/Vientiane}
  environment: &app-env
    DATABASE_URL: postgresql://postgres:postgres@db:5432/lottery_db?schema=public
    TZ: Asia/Vientiane
  networks: [lottery-net]

services:
  db:
    image: postgres:17-alpine
    container_name: lottery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lottery_db
      TZ: Asia/Vientiane
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - lottery-db-data:/var/lib/postgresql/data
    networks: [lottery-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lottery_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    container_name: lottery-migrate
    command: ["bun", "docker/migrate.ts"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    container_name: lottery-app
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_SECRET: ${AUTH_SECRET:?ตั้ง AUTH_SECRET ใน .env ก่อน}
      AUTH_TRUST_HOST: "true"
    ports:
      - "${APP_PORT:-3010}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    container_name: lottery-worker
    command: ["bun", "worker/whatsapp.ts"]
    restart: unless-stopped
    environment:
      <<: *app-env
      WA_AUTH_DIR: /data/wa-auth
    volumes:
      - wa-auth:/data/wa-auth
    # ให้บอทมีเวลาปิดการเชื่อมต่อ WhatsApp ก่อนถูกฆ่า
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  lottery-net:
    name: lottery-net

volumes:
  lottery-db-data:
    # ชื่อเดิมของ volume ที่มีข้อมูลอยู่แล้ว — ห้ามเปลี่ยน ไม่งั้นจะได้ฐานข้อมูลว่างใหม่
    name: nexttemplate_lottery-db-data
  wa-auth:
    name: lottery-wa-auth
