# ระบบทั้งหมดรันใน Docker network เดียวกัน (lottery-net) — docker compose up -d --build
#
#   db       PostgreSQL · ข้อมูลอยู่ใน volume lottery-db-data (down ไม่ลบ · down -v ลบทั้งหมด)
#   migrate  เตรียมตาราง/ย้ายข้อมูลแล้วจบ (เว็บและบอทรอให้เสร็จก่อน)
#   app      เว็บ http://localhost:${APP_PORT:-3010}
#   worker   บอท WhatsApp — สแกน QR และเลือกกลุ่มที่หน้าเว็บ /whatsapp · session อยู่ใน volume wa-auth
#   uploads  ไฟล์รูปโพยอยู่ในโฟลเดอร์ ./uploads ของโปรเจกต์ (ฐานข้อมูลเก็บแค่ path) — สำรองข้อมูลต้องสำรองโฟลเดอร์นี้ด้วย
#   ocr      อ่านตัวหนังสือจากรูปโพย (PaddleOCR + Tesseract บน CPU ฟรี ไม่ส่งรูปออกนอกเครื่อง) — บอทเรียกใช้
#            ไม่เปิดพอร์ตออกนอก network · ล่มชั่วคราวได้ รูปรอคิว (ไฟล์ใน uploads) แล้วอ่านต่อเมื่อกลับมา
#
# ในเครือข่ายภายใน ทุก service เรียกฐานข้อมูลด้วยชื่อ "db" · ค่าลับ (AUTH_SECRET) อ่านจาก .env
# พอร์ต 5434 ของฐานข้อมูลเปิดไว้ให้ bun run dev / prisma studio บนเครื่องนี้ (ผูกกับ 127.0.0.1 เท่านั้น)
name: nexttemplate

x-app: &app
  image: lottery-app:latest
  build:
    context: .
    args:
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Lottery}
      NEXT_PUBLIC_APP_URL: ${DOCKER_APP_URL:-http://localhost:3010}
      NEXT_PUBLIC_TIME_ZONE: ${NEXT_PUBLIC_TIME_ZONE:-Asia/Vientiane}
  environment: &app-env
    DATABASE_URL: postgresql://postgres:postgres@db:5432/lottery_db?schema=public
    TZ: Asia/Vientiane
  # รูปโพยเป็นไฟล์ในโฟลเดอร์ uploads ของโปรเจกต์ (ฐานข้อมูลเก็บแค่ path) — migrate ย้ายรูปเก่า · app เสิร์ฟ · worker บันทึก
  volumes:
    - ./uploads:/app/uploads
  networks: [lottery-net]

services:
  db:
    image: postgres:17-alpine
    container_name: lottery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lottery_db
      TZ: Asia/Vientiane
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - lottery-db-data:/var/lib/postgresql/data
    networks: [lottery-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lottery_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    container_name: lottery-migrate
    command: ["bun", "docker/migrate.ts"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    container_name: lottery-app
    restart: unless-stopped
    environment:
      <<: *app-env
      AUTH_SECRET: ${AUTH_SECRET:?ตั้ง AUTH_SECRET ใน .env ก่อน}
      AUTH_TRUST_HOST: "true"
    ports:
      - "${APP_PORT:-3010}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    container_name: lottery-worker
    command: ["bun", "worker/whatsapp.ts"]
    restart: unless-stopped
    environment:
      <<: *app-env
      WA_AUTH_DIR: /data/wa-auth
      OCR_URL: http://ocr:8000
      # ตั้งใน .env แล้วบอทอ่านรูปด้วย Claude ก่อน (src/lottery/image-ai.ts) — อ่านไม่ได้/เครดิตหมด/ติดต่อไม่ได้ ใช้บริการ ocr แทน
      # (บริการ ocr จึงต้องเปิดไว้เสมอ) · ว่าง = ใช้บริการ ocr อย่างเดียวตามเดิม
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_OCR_MODEL: ${CLAUDE_OCR_MODEL:-}
      # Ollama Cloud (ผสมกับ Claude ได้ — แม่หวยเลือกรุ่นที่หน้าแม่หวย) · OCR_MODEL = รุ่นหลักของโหมดอัตโนมัติ
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OCR_MODEL: ${OCR_MODEL:-}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-}
    volumes:
      - wa-auth:/data/wa-auth
      - ./uploads:/app/uploads
    # ให้บอทมีเวลาปิดการเชื่อมต่อ WhatsApp ก่อนถูกฆ่า
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  ocr:
    image: lottery-ocr:latest
    build: ./ocr
    container_name: lottery-ocr
    restart: unless-stopped
    networks: [lottery-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  lottery-net:
    name: lottery-net

volumes:
  lottery-db-data:
    # ชื่อเดิมของ volume ที่มีข้อมูลอยู่แล้ว — ห้ามเปลี่ยน ไม่งั้นจะได้ฐานข้อมูลว่างใหม่
    name: nexttemplate_lottery-db-data
  wa-auth:
    name: lottery-wa-auth
